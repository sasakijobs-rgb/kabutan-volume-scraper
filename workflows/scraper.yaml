name: Kabutan Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Create start marker
        run: |
          date
          touch /tmp/job_start_marker

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper.py

      - name: Check output
        run: |
          echo "===== output (after job start) ====="
          find output -type f -newer /tmp/job_start_marker \
          -exec ls -lh --time-style="+%Y-%m-%d %H:%M:%S" {} \;

      # =====================================
      # ★ここが追加（lastへコピー）
      # =====================================
      - name: Copy today to last
        run: |
          if [ -f output/today_data20.csv ]; then
            cp output/today_data20.csv output/last_data20.csv
          fi

      # =====================================
      # commit
      # =====================================
      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          git commit -m "update scraper result" || echo "no changes"

          git push
