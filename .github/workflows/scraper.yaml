name: scraper

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - cleanup
          - nikkei_vi
          - nikkei_avg
          - data2csv
          - db_stock_reports
          - db_trading_value

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 実行可否チェック
      # -------------------------
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[INFO] manual run -> always allowed"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(TZ=Asia/Tokyo date +%H%M)
          echo "[INFO] schedule run time = $NOW"

          if [ "$NOW" -ge 1545 ] && [ "$NOW" -le 2115 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------
      # 以下すべて条件付き実行
      # -------------------------
      - name: Checkout
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        if: steps.check.outputs.run == 'true'
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Create output
        if: steps.check.outputs.run == 'true'
        run: mkdir -p output

      - name: Run scraper
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="normal"
          fi

          echo "[MODE] $MODE"
          python scraper.py "$MODE"

      - name: Commit CSV
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv || true
          git diff --staged --quiet || git commit -m "Update CSV"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
