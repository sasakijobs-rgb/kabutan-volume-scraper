name: scraper

on:
  schedule:
    - cron: "0 1 * * *"   # JST 7:00
    - cron: "0 3 * * *"   # JST 10:00
    - cron: "0 5 * * *"   # JST 13:00
    - cron: "0 7 * * *"   # JST 16:00
  
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - cleanup
          - nikkei_vi
          - nikkei_avg
          - csv_trading_value
          - db_stock_reports
          - db_trading_value

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # ① 時間判定＆last20.csvが処理済ならSKIP
      # -----------------------
      - name: Time + CSV check
        id: gate
        run: |
          NOW=$(TZ=Asia/Tokyo date +%H%M)
          FILE="output/last_data20.csv"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          echo "[INFO] JST time = $NOW"

          # 時間判定
          if [ "$NOW" -lt 1545 ] || [ "$NOW" -gt 2115 ]; then
            echo "SKIP: time out"
            exit 0
          fi

          # ファイルチェック
          if [ -f "$FILE" ]; then
            FILE_DATE=$(TZ=Asia/Tokyo stat -c %y "$FILE" | cut -d' ' -f1)

            echo "[INFO] FILE_DATE=$FILE_DATE"
            echo "[INFO] TODAY=$TODAY"

            if [ "$FILE_DATE" = "$TODAY" ]; then
              echo "SKIP: already updated today"
              exit 0
            fi
          fi

          echo "OK: run scraper"
          
      - name: Checkout
        if: steps.time.outputs.time_ok == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time.outputs.time_ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.time.outputs.time_ok == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        if: steps.time.outputs.time_ok == 'true'
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Create output
        if: steps.time.outputs.time_ok == 'true'
        run: mkdir -p output

      - name: Run scraper
        if: steps.time.outputs.time_ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="normal"
          fi

          echo "[MODE] $MODE"
          python scraper.py "$MODE"

      - name: Commit CSV
        if: steps.time.outputs.time_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add output/*.csv || true
      
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
      
          git commit -m "Update CSV"
      
          # ★ push失敗時だけリトライ
          for i in 1 2 3
          do
            if git push origin HEAD:main; then
              echo "Push success"
              exit 0
            fi
      
            echo "Push failed (attempt $i)"
      
            git fetch origin main
            git reset --hard origin/main
      
            git add output/*.csv || true
      
            if git diff --cached --quiet; then
              echo "Nothing to commit after sync"
              exit 0
            fi
      
            git commit -m "Update CSV (retry $i)"
      
            sleep 10
          done
      
          echo "Failed after retries"
          exit 1


          
