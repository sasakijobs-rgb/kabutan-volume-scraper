name: scraper

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # 時間判定（JST）
      # -----------------------
      - name: Time check
        id: time
        run: |
          NOW=$(TZ=Asia/Tokyo date +%H%M)
          echo "[INFO] JST time = $NOW"

          if [ "$NOW" -ge 1545 ] && [ "$NOW" -le 2115 ]; then
            echo "time_ok=true" >> "$GITHUB_OUTPUT"
            echo "✔ 実行時間内"
          else
            echo "time_ok=false" >> "$GITHUB_OUTPUT"
            echo "⛔ 実行時間外"
          fi

      # -----------------------
      # 時間外ならここで停止
      # -----------------------
      - name: Stop if out of time
        if: steps.time.outputs.time_ok != 'true'
        run: |
          echo "========================"
          echo "⛔ SKIPPED"
          echo "理由: 15:45〜21:15 JST以外"
          echo "========================"
          exit 0

      # -----------------------
      # 本番処理（時間内のみ）
      # -----------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Create output
        run: mkdir -p output

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "[MODE] normal"
          python scraper.py normal

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv || true
          git diff --staged --quiet || git commit -m "Update CSV"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
