name: nikkei scraper stable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. リポジトリ取得（完全履歴）
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Pythonセットアップ
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # 3. 依存関係インストール
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # =========================
      # 4. Chromeインストール
      # =========================
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # =========================
      # 5. リポジトリ状態を完全同期
      # （ここが重要：前回データ問題の原因潰し）
      # =========================
      - name: Sync repository state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # =========================
      # 6. スクレイピング実行
      # =========================
      - name: Run scraper
        run: python scraper_test.py

      # =========================
      # 7. commit & push（競合対策込み）
      # =========================
      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add output/nikkei_avg_data.csv

          git commit -m "update nikkei data" || echo "no changes"

          # push失敗時に最新を取り直して再push
          git pull --rebase origin main || true

          git push origin main
