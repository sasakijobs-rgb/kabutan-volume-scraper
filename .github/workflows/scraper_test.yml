name: scraper test

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # デバッグ用（ファイル確認したい場合）
      - name: List files
        run: ls -R

      - name: Run scraper
        run: |
          python nikkei_avg_data.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: output/
