name: nikkei_data_test

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests beautifulsoup4

      - name: Create output directory
        run: mkdir -p output

      - name: Run data2csv
        run: python data2csv.py
        
      - name: Run nikkei_avg_data
        run: python nikkei_avg_data.py

      - name: Run nikkei_vi_data
        run: python nikkei_vi_data.py

      - name: Show generated files
        if: always()
        run: |
          echo "===== CURRENT DIR ====="
          pwd

          echo "===== OUTPUT ====="
          ls -lah output || true

          echo "===== ALL FILES ====="
          find . -type f | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-output
          path: output/

      - name: Commit CSV files to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          git diff --staged --quiet || git commit -m "Update Nikkei CSV files"

          git push
