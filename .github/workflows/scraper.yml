name: Kabutan Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # リポジトリ取得
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # Pythonライブラリ
      # =========================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas

      # =========================
      # Chromiumインストール
      # =========================
      - name: Install chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || true

      # =========================
      # requirementsインストール
      # =========================
      - name: Install dependencies
        run: pip install -r requirements.txt

      # =========================
      # scraper実行
      # =========================
      - name: Run scraper
        run: |
          python scraper.py

      # =========================
      # output確認
      # =========================
      - name: Check output
        run: |
          echo "===== output ====="
          ls -R
          echo "===== output folder ====="
          ls -R output || true

      # =========================
      # commit & push
      # =========================
      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/ || true
          git commit -m "update scraper result" || echo "no changes"

          git pull --rebase origin main
          git push
