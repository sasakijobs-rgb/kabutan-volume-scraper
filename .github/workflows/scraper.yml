name: Kabutan Volume Scraper

on:
  schedule:
    - cron: '0 7 * * *'  # UTCで7:00 → 日本時間16:00
  workflow_dispatch:      # 手動での実行も可能

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # リポジトリ取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python セットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 依存パッケージインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 出力フォルダ作成とスクリプト実行
      - name: Run scraper
        run: |
          mkdir -p output
          python kabutan-volume-scraper/scraper.py

      # CSVをArtifactとして保存
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: volume-ranking
          path: output/
