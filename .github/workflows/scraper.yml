import time
import random
from selenium import webdriver
from selenium.webdriver.common.by import By

# =========================
# 設定
# =========================
URL = "https://kabutan.jp/warning/trading_value_ranking?market=0&capitalization=-1&dispmode=normal&stc=&stm=0&page=1"

print("===== START =====")
print(f"TARGET URL: {URL}")

# =========================
# Chromeオプション（重要）
# =========================
options = webdriver.ChromeOptions()

options.add_argument("--headless=new")
options.add_argument("--no-sandbox")
options.add_argument("--disable-dev-shm-usage")
options.add_argument("--window-size=1920,1080")
options.add_argument("--lang=ja-JP")

options.add_argument(
    "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
)

print("===== Chrome起動 =====")

# webdriver-managerは使わない（重要）
driver = webdriver.Chrome(options=options)

try:
    print("===== アクセス開始 =====")
    driver.get(URL)

    time.sleep(5 + random.random() * 3)

    print("===== ページ情報 =====")
    print("TITLE:", driver.title)
    print("CURRENT URL:", driver.current_url)

    html = driver.page_source
    print("HTML長:", len(html))
    print("HTML先頭1000文字:")
    print(html[:1000])

    print("===== TABLEチェック =====")

    tables = driver.find_elements(By.TAG_NAME, "table")
    print("table数:", len(tables))

    stock_tables = driver.find_elements(By.CSS_SELECTOR, "table.stock_table")
    print("stock_table数:", len(stock_tables))

    rows = driver.find_elements(By.CSS_SELECTOR, "table.stock_table.st_market tbody tr")
    print("tr数:", len(rows))

    if not rows:
        print("❌ データ取得できず（WAF or selector問題）")
    else:
        print("===== 1件だけ抽出テスト =====")

        row = rows[0]

        code = row.find_element(By.CSS_SELECTOR, "td a").text
        name = row.find_element(By.CSS_SELECTOR, "th").text

        tds = row.find_elements(By.TAG_NAME, "td")

        price = tds[4].text if len(tds) > 4 else ""
        change = tds[6].text if len(tds) > 6 else ""
        volume = tds[8].text if len(tds) > 8 else ""
        per = tds[9].text if len(tds) > 9 else ""
        pbr = tds[10].text if len(tds) > 10 else ""
        yield_ = tds[11].text if len(tds) > 11 else ""

        print("===== 取得結果（テスト1件）=====")
        print("コード:", code)
        print("銘柄名:", name)
        print("株価:", price)
        print("前日比:", change)
        print("売買代金:", volume)
        print("PER:", per)
        print("PBR:", pbr)
        print("利回り:", yield_)

    print("===== END =====")

except Exception as e:
    print("===== ERROR =====")
    print(e)

finally:
    driver.quit()
    print("===== Chrome終了 =====")
