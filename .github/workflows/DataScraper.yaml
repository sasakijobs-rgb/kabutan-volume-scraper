name: DataScraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Chrome（scraper用）
      # =========================
      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # =========================
      # ★① stock_reports（追加）
      # =========================
      - name: Run stock reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python stock_reports.py

      # =========================
      # ★② scraper本体
      # =========================
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper.py

      # =========================
      # output確認
      # =========================
      - name: Create start marker
        run: |
          date
          touch /tmp/job_start_marker

      - name: Check output
        run: |
          echo "===== output (after job start) ====="
          find output -type f -newer /tmp/job_start_marker \
          -exec ls -lh --time-style="+%Y-%m-%d %H:%M:%S" {} \;

      # =========================
      # copy処理
      # =========================
      - name: Copy today to last
        run: |
          if [ -f output/today_data20.csv ]; then
            cp output/today_data20.csv output/last_data20.csv
          fi

      # =========================
      # commit & push
      # =========================
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          git add output/*.csv
          git commit -m "daily update" || exit 0
          git push origin HEAD:main --force

