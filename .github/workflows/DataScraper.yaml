name: DataScraper

on:
  workflow_dispatch:
  schedule:
  - cron: "0 7 * * *"  # 16:00日本時間

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Chrome（scraper用）
      # =========================
      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Create output directory
        run: mkdir -p output

      - name: Run nikkei_avg_data
        run: python nikkei_avg_data.py

      - name: Run nikkei_vi_data
        run: python nikkei_vi_data.py

      - name: Run stock reports scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python stock_reports.py        

      - name: Run data2csv
        run: python data2csv.py

      - name: Run import csv to supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python import_csv_to_supabase.py

      - name: Show generated files
        if: always()
        run: |
          echo "===== CURRENT DIR ====="
          pwd

          echo "===== OUTPUT ====="
          ls -lah output || true

          echo "===== ALL FILES ====="
          find . -type f | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-output
          path: output/

      - name: Commit CSV files to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          git diff --staged --quiet || git commit -m "Update Nikkei CSV files"

          git push
