name: CSV Trading Value

on:
  workflow_dispatch:

jobs:
  trading-value:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true   # ★処理前にワークツリーをクリーン化

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ★処理前クリア（念のため二重安全）
      - name: Pre-clean output
        run: |
          rm -rf output/*
          mkdir -p output

      - name: Run script
        run: |
          python CSV_trading_value.py

      # ★コミット処理
      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          git diff --cached --quiet || git commit -m "Update trading value CSV"

          git push origin HEAD:main

      # ★処理後クリア（CIを汚さない）
      - name: Post-clean
        if: always()
        run: |
          git reset --hard
          git clean -fd
