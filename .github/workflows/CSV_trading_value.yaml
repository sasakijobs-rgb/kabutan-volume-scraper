name: CSV Trading Value

on:
  workflow_dispatch:

jobs:
  trading-value:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ← pushするので write が必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python CSV_trading_value.py

      # ★ここから追加
      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          git diff --cached --quiet || git commit -m "Update trading value CSV"

          git pull --rebase origin main   # ★追加（重要）
          git push origin HEAD:main

      - name: Upload CSV and Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading_value_output
          path: |
            output/*.csv
            output/*.log
          if-no-files-found: warn
          retention-days: 30
